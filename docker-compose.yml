services:
  # ============================================================================
  # 1. PostgreSQL Relational Database Service
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: jeevadrishti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jeevadrishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeevadrishti_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-jeevadrishti_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jeevadrishti} -d ${POSTGRES_DB:-jeevadrishti_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jeevadrishti-network

  # ============================================================================
  # 2. FastAPI Inference & Analysis Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeevadrishti-backend
    restart: unless-stopped
    environment:
      APP_NAME: "JeevaDrishti API"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "production"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
      API_V1_PREFIX: "/api/v1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-jeevadrishti}:${POSTGRES_PASSWORD:-jeevadrishti_secure_pass_2026}@db:5432/${POSTGRES_DB:-jeevadrishti_prod}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jeevadrishti-production-secret-key-32bytes-min-required}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      UPLOAD_DIR: "/app/uploads"
      MAX_UPLOAD_SIZE_MB: "20"
      SAM_MODEL_PATH: ${SAM_MODEL_PATH:-/models/sam_vit_h_4b8939.pth}
      SAM_MODEL_TYPE: "vit_h"
      MAX_LIVE_CANDIDATES: "15"
      VLM_PROVIDER: ${VLM_PROVIDER:-gemini}
      VLM_MODEL: ${VLM_MODEL:-gemini-2.5-flash}
      VLM_API_KEY: ${VLM_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - ${HOST_MODELS_DIR:-./models}:/models:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - jeevadrishti-network

  # ============================================================================
  # 3. React Frontend & Nginx Reverse Proxy Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jeevadrishti-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - jeevadrishti-network

volumes:
  postgres_data:
    name: jeevadrishti_postgres_data
  uploads_data:
    name: jeevadrishti_uploads_data

networks:
  jeevadrishti-network:
    name: jeevadrishti_net
    driver: bridge
