<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JeevaDrishti — An AI-powered microscopy platform for intelligent cell detection using hybrid vision-language models." />
    <meta name="theme-color" content="#02060D" />
    <title>JeevaDrishti — Empowering Microscopy with Intelligent Vision</title>
    <!-- Google Fonts: Space Grotesk (Headings), Inter (Body), JetBrains Mono (Technical/Labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var errDiv = document.getElementById('runtime-error-display');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'runtime-error-display';
          errDiv.style.position = 'fixed';
          errDiv.style.top = '16px';
          errDiv.style.left = '16px';
          errDiv.style.right = '16px';
          errDiv.style.padding = '20px';
          errDiv.style.background = '#30020d';
          errDiv.style.border = '2px solid #FF2A55';
          errDiv.style.borderRadius = '12px';
          errDiv.style.color = '#fff';
          errDiv.style.zIndex = '999999';
          errDiv.style.fontFamily = 'monospace';
          errDiv.style.fontSize = '14px';
          errDiv.style.whiteSpace = 'pre-wrap';
          document.body.appendChild(errDiv);
        }
        errDiv.innerText = '⚠️ Startup Error: ' + (e.message || e.error || 'Unknown error') + '\n\nFile: ' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Captured unhandled rejection:', e);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
